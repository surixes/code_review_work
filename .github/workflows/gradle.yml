name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 3'   
    - cron: '0 22 * * 5'   

jobs: 
  build: 
    runs-on: ubuntu-latest
        
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          
      - name: Build and test with maven
        run: mvn -B clean verify
